modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="Built with love on top of the Create mod by simibubi & the Create team."
authors="${mod_authors}"
displayURL="https://github.com/CobanF8/create-stats"
issueTrackerURL="https://github.com/CobanF8/create-stats/issues"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="create"
type="required"
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ponder"
type="required"
versionRange="[${ponder_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="flywheel"
type="required"
versionRange="${flywheel_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="simulated"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="geckolib"
type="optional"
versionRange="[4.8,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="linktablet"
type="optional"
versionRange="[1.10.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aeronautics_bundled"
type="optional"
versionRange="[1,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19.21.0,)"
ordering="AFTER"
side="CLIENT"
